[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "command-complete-sir"
version = "0.1.0"
description = "Windows notifications when commands and autostart apps finish."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hereip" }]
keywords = ["windows", "notification", "cli", "autostart", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9",
    "plyer>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "black>=24"]

[project.scripts]
ccs = "ccs.cli_ccs:main"
acs = "ccs.cli_acs:main"

[project.urls]
Homepage = "https://github.com/hereip/CCS"
Issues = "https://github.com/hereip/CCS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
